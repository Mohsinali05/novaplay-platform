<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Roulette</title><link rel="stylesheet" href="game.css"></head><body><div class="wrap"><header class="bar"><a class="brand" href="/casino.html"><b>N</b> NOVAPLAY</a><a class="back" href="/casino.html">← GAME LOBBY</a></header><main class="game"><p class="eyebrow">EUROPEAN ROULETTE PROTOTYPE</p><h1>Nova Roulette</h1><p class="muted">Choose a colour, then spin the practice wheel.</p><div class="balance">DEMO POINTS: <b id="balance">1,000</b></div><div style="font-size:86px;margin:15px">🎡</div><p class="muted">Select your practice pick (10 demo points)</p><div class="choices"><button class="choice selected" data-pick="red">Red</button><button class="choice" data-pick="black">Black</button><button class="choice" data-pick="green">Green (0)</button></div><button class="btn" id="spin">SPIN WHEEL</button><div class="result" id="result">Choose a colour and spin.</div><p class="notice">Virtual demo points only. No cash value or real-money play.</p></main></div><script>let balance=1000,pick='red';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{pick=b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('selected',x===b));});document.getElementById('spin').onclick=()=>{if(balance<10)return;balance-=10;const n=Math.floor(Math.random()*37),colour=n===0?'green':n%2?'red':'black';let prize=0;if(pick===colour)prize=pick==='green'?360:20;balance+=prize;document.getElementById('balance').textContent=balance.toLocaleString();document.getElementById('result').textContent=`Ball: ${n} (${colour}). ${prize?`You earned ${prize} demo points.`:'No match this round.'}`;};</script></body></html>
